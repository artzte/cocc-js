<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Central Oregon Community College CIS-133JS: Introduction to JavaScript, Fall 2026 — Final Project Preview Directory"
    />
    <title>
      Central Oregon Community College CIS-133JS: Introduction to JavaScript,
      Fall 2026
    </title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.6;
        color: var(--text);
        background-color: var(--bg);
      }

      header,
      main,
      footer {
        max-width: 48rem;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      header {
        padding-top: 3rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
      }

      .eyebrow {
        margin: 0 0 0.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        line-height: 1.25;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
      }

      .subtitle a,
      footer a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }

      .subtitle a:hover,
      footer a:hover {
        color: var(--accent-hover);
      }

      main {
        padding-top: 2rem;
        padding-bottom: 3rem;
      }

      h2 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      .project-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.75rem;
      }

      .project-list li {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .project-list li:hover {
        border-color: var(--accent);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      }

      .project-link {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        text-decoration: none;
        color: inherit;
      }

      .project-title {
        font-weight: 600;
        color: var(--accent);
      }

      .project-slug {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
        color: var(--muted);
      }

      footer {
        padding-top: 1.5rem;
        padding-bottom: 3rem;
        border-top: 1px solid var(--border);
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">Central Oregon Community College</p>
      <h1>
        Central Oregon Community College CIS-133JS: Introduction to JavaScript,
        Fall 2026
      </h1>
      <p class="subtitle">
        Final Project Preview Directory ·
        <a href="https://github.com/artzte/cocc-js">Course Repository</a>
      </p>
    </header>

    <main>
      <h2>Final Project Sites</h2>
      <!--
        Template: deploy-root-index.sh replaces the PROJECTS marker below with one
        entry per student from infra/students.local.json, sorted by slug.
      -->
      <ul class="project-list">
        <!-- PROJECTS -->
      </ul>
    </main>

    <footer>
      <p>
        CIS-133JS: Introduction to JavaScript (Fall 2026) ·
        <a href="https://github.com/artzte/cocc-js"
          >github.com/artzte/cocc-js</a
        >
      </p>
    </footer>
  </body>
</html>
