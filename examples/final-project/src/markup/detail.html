<div id="art-gallery-detail">
  <header class="detail-header">
    <h2>{{title}}</h2>
    <a href="{{homeUrl}}" data-action="route">&lt;&lt; back</a>
  </header>
  <p class="maker">{{maker}}</p>
  <div class="image"><img src="{{imageUrl}}" alt="{{title}}" /></div>
  <p class="info">{{description}}</p>
  <p class="history">{{history}}</p>
</div>
