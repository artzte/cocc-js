<div id="art-gallery">
  <header class="gallery-header">
    <h1>Victoria and Albert Museum</h1>
    <a
      href="https://www.vam.ac.uk/"
      aria-label="Victoria and Albert Museum website"
      >🔗</a
    >
  </header>
  <form id="search" role="search">
    <input
      type="text"
      name="search"
      aria-label="Search the collection"
      placeholder="Search..."
      value="{{searchText}}"
    />
    <button type="submit">Find</button>
    <button type="reset" data-action="reset">Reset</button>
  </form>
  <div class="art-gallery-results"></div>
</div>
