<div id="art-gallery">
  <h1>
    <div>Victoria and Albert Museum</div>
    <a href="https://www.vam.ac.uk/">🔗</a>
  </h1>
  <form id="search">
    <input
      type="text"
      name="search"
      placeholder="Search..."
      value="{{searchText}}"
    />
    <button type="submit">Find</button>
    <button type="reset" data-action="reset">Reset</button>
  </form>
  <div class="art-gallery-results"></div>
</div>
